{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Auth{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'summarizer/css/style.css' %}">
<link rel="stylesheet" href="{% static 'summarizer/css/auth.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
<div class="container">
<a class="navbar-brand fw-bold fs-3" href="{% url 'index' %}">NoteMind AI</a>
<div><a href="{% url 'index' %}" class="nav-link">Home</a></div>
</div>
</nav>

{% if messages %}
<div class="container mt-4">
{% for message in messages %}
<div class="alert alert-{{ message.tags|default:'info' }} mb-2" role="alert">{{ message }}</div>
{% endfor %}
</div>
{% endif %}

{% block content %}
{% endblock %}

<footer class="footer-section py-4 text-center">
<div class="container">
<p class="mb-0">&copy; 2026 NoteMind AI. All rights reserved.</p>
</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
