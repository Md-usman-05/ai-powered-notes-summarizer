{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Notes Summarizer{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'summarizer/css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 sticky-top">
<div class="container">
<a class="navbar-brand fw-bold fs-3" href="{% url 'index' %}">NoteMind AI</a>
<button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarContent">
<ul class="navbar-nav mx-auto gap-lg-4">
<li class="nav-item"><a class="nav-link active" href="{% url 'index' %}#home">Home</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'index' %}#features">Features</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'index' %}#about">About</a></li>
</ul>
<div class="d-flex gap-2">
{% if jwt_user %}
<a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Dashboard</a>
<a href="{% url 'logout' %}" class="btn btn-primary">Logout</a>
{% else %}
<a href="{% url 'login' %}" class="btn btn-outline-primary">Login</a>
<a href="{% url 'register' %}" class="btn btn-primary">Get Started</a>
{% endif %}
</div>
</div>
</div>
</nav>

{% block content %}
{% endblock %}

<footer class="footer-section">
<div class="container">
<p class="mb-0">&copy; 2026 NoteMind AI. All rights reserved.</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'summarizer/css/js/main.js' %}"></script>
</body>
</html>
